<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whack-a-Mole</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{ box-sizing:border-box }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-family:Segoe UI, system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:#e5e7eb;
}

h1{ margin-bottom:8px; }

/* top bar */
.stats{
  display:flex;
  gap:20px;
  margin-bottom:14px;
  font-weight:600;
}

/* field */
#field{
  display:grid;
  grid-template-columns: repeat(3, 90px);
  gap:16px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  padding:20px;
  border-radius:18px;

  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

/* holes */
.mole{
  width:90px;
  height:90px;
  border-radius:50%;
  position:relative;
  cursor:pointer;

  background: rgba(255,255,255,0.12);
  box-shadow:
    inset 0 6px 0 rgba(0,0,0,0.35),
    0 6px 16px rgba(0,0,0,0.45);

  overflow:hidden;
}

/* mole head */
.mole::after{
  content:"🐹";
  position:absolute;
  left:50%;
  bottom:-60px;
  transform:translateX(-50%);
  font-size:42px;
  transition: bottom 0.15s ease;
}

/* active */
.mole.active::after{
  bottom:12px;
}

/* hit effect */
.mole.hit::after{
  content:"💥";
  bottom:16px;
}

/* controls */
.controls{
  margin-top:14px;
}

button{
  padding:10px 20px;
  font-weight:600;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background: rgba(255,255,255,0.12);
  color:#e5e7eb;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 16px rgba(0,0,0,0.35);

  transition: background 0.2s ease, transform 0.15s ease;
}

button:hover{
  background: rgba(255,255,255,0.18);
  transform: translateY(-1px);
}
</style>
</head>

<body>

<h1>Whack-a-Mole</h1>

<div class="stats">
  <div>Score: <span id="score">0</span></div>
  <div>Time: <span id="time">30</span>s</div>
</div>

<div id="field"></div>

<div class="controls">
  <button id="start">Start</button>
  <button id="reset">Reset</button>
</div>

<script>
let score = 0;
let time = 30;
let gameLoop, timerLoop;
let running = false;

/* build field */
for(let i=0;i<9;i++){
  $('#field').append('<div class="mole"></div>');
}

/* start game */
$('#start').click(()=>{
  if(running) return;
  running = true;
  score = 0;
  time = 30;
  updateUI();

  gameLoop = setInterval(spawnMole, 700);
  timerLoop = setInterval(()=>{
    time--;
    updateUI();
    if(time <= 0) endGame();
  },1000);
});

/* reset */
$('#reset').click(()=>{
  endGame(true);
});

/* spawn mole */
function spawnMole(){
  $('.mole').removeClass('active hit');
  $('.mole').eq(Math.floor(Math.random()*9)).addClass('active');
}

/* hit detection */
$(document).on('click', '.mole.active', function(){
  if(!running) return;
  score++;
  $(this).addClass('hit').removeClass('active');
  updateUI();
});

/* helpers */
function updateUI(){
  $('#score').text(score);
  $('#time').text(time);
}

function endGame(reset=false){
  clearInterval(gameLoop);
  clearInterval(timerLoop);
  running = false;
  $('.mole').removeClass('active hit');

  if(!reset){
    alert(`Time's up! Final score: ${score}`);
  }
}
</script>

</body>
</html>
