<!DOCTYPE html>
<html>
<head>
<title>Snake</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{ box-sizing:border-box }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-family:Segoe UI,system-ui,sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:#e5e7eb;
}

h1{
  margin-bottom:12px;
}

#board{
  width:300px;
  height:300px;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  grid-template-rows:repeat(10,1fr);

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  border-radius:16px;
  padding:6px;

  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

.cell{
  border-radius:6px;
}

.snake{
  background:#22c55e;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
}

.food{
  background:#ef4444;
  box-shadow: 0 0 12px rgba(239,68,68,0.8);
}

.controls{
  display: flex;
  gap: 12px;
  margin-top: 14px;
}

button{
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;

  background: rgba(255,255,255,0.12);
  color: #e5e7eb;

  border: none;
  border-radius: 12px;
  cursor: pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 16px rgba(0,0,0,0.35);

  transition: background 0.2s ease, transform 0.15s ease;
}

button:hover{
  background: rgba(255,255,255,0.18);
  transform: translateY(-1px);
}

button:active{
  transform: translateY(1px);
}


#status{
  margin-top:12px;
  font-size:14px;
  opacity:0.85;
}
</style>
</head>

<body>

<h1>Snake</h1>
<div id="board"></div>
<div class="controls">
  <button id="start">Start</button>
  <button id="restart">Restart</button>
</div>
<div id="status">Use arrow keys</div>

<script>
const SIZE = 10;
let snake, food, dir, nextDir;
let gameOver = false;
let running = false;
let loop;

function resetGame(){
  snake = [44];
  food = randomFood();
  dir = 1;
  nextDir = dir;
  gameOver = false;
  running = false;
  $('#status').text('Press Start');
  draw();
}

function randomFood(){
  let f;
  do{
    f = Math.floor(Math.random()*SIZE*SIZE);
  }while(snake.includes(f));
  return f;
}

function draw(){
  $('.cell').removeClass('snake food');
  snake.forEach(i => $('.cell').eq(i).addClass('snake'));
  $('.cell').eq(food).addClass('food');
}

function move(){
  if(!running || gameOver) return;

  dir = nextDir;
  const head = snake[0];
  const newHead = head + dir;

  if(
    newHead < 0 ||
    newHead >= SIZE*SIZE ||
    (dir === 1 && head % SIZE === SIZE-1) ||
    (dir === -1 && head % SIZE === 0) ||
    snake.includes(newHead)
  ){
    gameOver = true;
    running = false;
    $('#status').text('Game Over');
    return;
  }

  snake.unshift(newHead);

  if(newHead === food){
    food = randomFood();
  }else{
    snake.pop();
  }

  draw();
}

/* controls */
$(document).keydown(e=>{
  if(!running) return;

  if(e.key === 'ArrowRight' && dir !== -1) nextDir = 1;
  if(e.key === 'ArrowLeft'  && dir !== 1)  nextDir = -1;
  if(e.key === 'ArrowDown'  && dir !== -SIZE) nextDir = SIZE;
  if(e.key === 'ArrowUp'    && dir !== SIZE)  nextDir = -SIZE;
});

$('#start').click(()=>{
  if(gameOver) resetGame();
  running = true;
  $('#status').text('Playing');
});

$('#restart').click(()=>{
  resetGame();
});

/* init */
for(let i=0;i<SIZE*SIZE;i++){
  $('#board').append('<div class="cell"></div>');
}

resetGame();
loop = setInterval(move, 200);

</script>

</body>
</html>
