<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simon Says</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{ box-sizing:border-box }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-family:Segoe UI, system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:#e5e7eb;
}

h1{ margin-bottom:10px; }

/* game shell */
#game{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding:26px;
  border-radius:22px;

  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

/* board */
#board{
  display:grid;
  grid-template-columns: repeat(2, 130px);
  gap:18px;
}

/* buttons */
.pad{
  width:130px;
  height:130px;
  border-radius:24px;
  cursor:pointer;
  opacity:0.7;

  box-shadow:
    inset 0 6px 0 rgba(0,0,0,0.35),
    0 10px 20px rgba(0,0,0,0.45);

  transition: opacity 0.15s ease, transform 0.1s ease;
}

.pad:hover{
  opacity:0.85;
}

/* colors */
.green{ background:#22c55e; }
.red{ background:#ef4444; }
.yellow{ background:#facc15; }
.blue{ background:#38bdf8; }

/* active flash */
.pad.active{
  opacity:1;
  transform: scale(1.05);
  box-shadow: 0 0 30px currentColor;
}

.stats{
  text-align:center;
  margin-top:14px;
  font-weight:600;
}

.controls{
  text-align:center;
  margin-top:12px;
}

button{
  padding:10px 20px;
  font-weight:600;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background: rgba(255,255,255,0.12);
  color:#e5e7eb;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 16px rgba(0,0,0,0.35);

  transition: background 0.2s ease, transform 0.15s ease;
}

button:hover{
  background: rgba(255,255,255,0.18);
  transform: translateY(-1px);
}
</style>
</head>

<body>

<h1>Simon Says</h1>

<div id="game">
  <div id="board">
    <div class="pad green" data-color="green"></div>
    <div class="pad red" data-color="red"></div>
    <div class="pad yellow" data-color="yellow"></div>
    <div class="pad blue" data-color="blue"></div>
  </div>

  <div class="stats">
    Round: <span id="round">0</span>
  </div>

  <div class="controls">
    <button id="start">Start</button>
    <button id="reset">Reset</button>
  </div>
</div>

<script>
const colors = ["green","red","yellow","blue"];
let sequence = [];
let playerIndex = 0;
let round = 0;
let acceptingInput = false;

/* flash pad */
function flash(color){
  const pad = $(`.pad.${color}`);
  pad.addClass('active');
  setTimeout(()=>pad.removeClass('active'), 300);
}

/* play sequence */
function playSequence(){
  acceptingInput = false;
  let i = 0;

  const interval = setInterval(()=>{
    flash(sequence[i]);
    i++;
    if(i >= sequence.length){
      clearInterval(interval);
      acceptingInput = true;
      playerIndex = 0;
    }
  }, 500);
}

/* start round */
function nextRound(){
  round++;
  $('#round').text(round);
  sequence.push(colors[Math.floor(Math.random()*4)]);
  playSequence();
}

/* pad click */
$('.pad').click(function(){
  if(!acceptingInput) return;

  const color = $(this).data('color');
  flash(color);

  if(color === sequence[playerIndex]){
    playerIndex++;
    if(playerIndex === sequence.length){
      setTimeout(nextRound, 600);
    }
  }else{
    gameOver();
  }
});

/* game over */
function gameOver(){
  alert(`Game Over! You reached round ${round}`);
  resetGame();
}

/* controls */
$('#start').click(()=>{
  resetGame();
  nextRound();
});

$('#reset').click(()=>{
  resetGame();
});

function resetGame(){
  sequence = [];
  round = 0;
  playerIndex = 0;
  acceptingInput = false;
  $('#round').text(0);
}
</script>

</body>
</html>
