<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{ box-sizing:border-box }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-family:Segoe UI, system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:#e5e7eb;
}

h1{ margin-bottom:10px; }

/* game shell */
#game{
  width:460px;
  height:340px;
  position:relative;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  border-radius:18px;
  padding:10px;

  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

/* playfield */
#field{
  position:relative;
  width:100%;
  height:100%;
  border-radius:12px;
  overflow:hidden;
}

/* paddle */
#paddle{
  position:absolute;
  bottom:10px;
  left:180px;
  width:80px;
  height:10px;
  border-radius:6px;

  background:#22c55e;
  box-shadow: 0 0 14px rgba(34,197,94,0.6);
}

/* ball */
#ball{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ef4444;
  box-shadow: 0 0 14px rgba(239,68,68,0.8);
}

/* bricks */
.brick{
  position:absolute;
  width:60px;
  height:18px;
  border-radius:6px;

  background:#38bdf8;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 4px 10px rgba(0,0,0,0.35);
}

.stats{
  margin-top:12px;
  font-size:14px;
  opacity:0.85;
}
</style>
</head>

<body>

<h1>Breakout</h1>

<div id="game">
  <div id="field">
    <div id="paddle"></div>
    <div id="ball"></div>
  </div>
</div>

<div class="stats">
  Score: <span id="score">0</span>
</div>

<script>
const field = $('#field');
const fieldW = field.width();
const fieldH = field.height();

let paddleX = 180;
let ball = { x:220, y:200, dx:3, dy:-3 };
let score = 0;

/* create bricks */
const rows = 4;
const cols = 7;
const brickW = 60;
const brickH = 18;
const padding = 8;
const offsetTop = 30;
const offsetLeft = 20;

for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
    const brick = $('<div class="brick"></div>');
    brick.css({
      left: offsetLeft + c*(brickW+padding),
      top: offsetTop + r*(brickH+padding)
    });
    field.append(brick);
  }
}

/* controls */
$(document).mousemove(e=>{
  const rect = field[0].getBoundingClientRect();
  paddleX = e.clientX - rect.left - 40;
  paddleX = Math.max(0, Math.min(fieldW-80, paddleX));
});

/* game loop */
function update(){
  ball.x += ball.dx;
  ball.y += ball.dy;

  /* walls */
  if(ball.x <= 0 || ball.x >= fieldW-10) ball.dx *= -1;
  if(ball.y <= 0) ball.dy *= -1;

  /* paddle */
  if(
    ball.y >= fieldH-30 &&
    ball.x >= paddleX &&
    ball.x <= paddleX + 80
  ){
    ball.dy *= -1;
    ball.y = fieldH-30;
  }

  /* bricks */
  $('.brick').each(function(){
    const b = $(this);
    const bx = b.position().left;
    const by = b.position().top;

    if(
      ball.x < bx + brickW &&
      ball.x + 10 > bx &&
      ball.y < by + brickH &&
      ball.y + 10 > by
    ){
      ball.dy *= -1;
      b.remove();
      score++;
      $('#score').text(score);
      return false;
    }
  });

  /* lose */
  if(ball.y > fieldH){
    alert('Game Over');
    location.reload();
  }

  $('#paddle').css({ left:paddleX });
  $('#ball').css({ left:ball.x, top:ball.y });
}

setInterval(update, 20);
</script>

</body>
</html>
