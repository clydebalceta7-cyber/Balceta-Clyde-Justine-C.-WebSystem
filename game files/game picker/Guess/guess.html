<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guess the Number</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{ box-sizing:border-box }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-family:Segoe UI, system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:#e5e7eb;
}

h1{ margin-bottom:10px; }

#game{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  padding:26px 30px;
  border-radius:18px;
  text-align:center;

  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

input{
  width:120px;
  padding:10px;
  font-size:16px;
  text-align:center;

  border:none;
  border-radius:12px;

  background: rgba(255,255,255,0.12);
  color:#e5e7eb;
  font-weight:600;
}

button{
  margin-left:10px;
  padding:10px 18px;
  font-weight:600;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background: rgba(255,255,255,0.12);
  color:#e5e7eb;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 16px rgba(0,0,0,0.35);

  transition: background 0.2s ease, transform 0.15s ease;
}

button:hover{
  background: rgba(255,255,255,0.18);
  transform: translateY(-1px);
}

#msg{
  margin-top:14px;
  font-weight:600;
}

.stats{
  margin-top:8px;
  font-size:14px;
  opacity:0.85;
}

.win{ color:#22c55e; }
.lose{ color:#ef4444; }
.hint{ color:#38bdf8; }

.controls{
  margin-top:14px;
}
</style>
</head>

<body>

<h1>Guess the Number</h1>

<div id="game">
  <p>I’m thinking of a number between <b>1 and 100</b></p>

  <input id="guess" type="number" min="1" max="100">
  <button id="try">Try</button>

  <div id="msg"></div>
  <div class="stats">
    Attempts left: <span id="tries">7</span>
  </div>

  <div class="controls">
    <button id="reset">Reset</button>
  </div>
</div>

<script>
let number;
let attempts;

function resetGame(){
  number = Math.floor(Math.random()*100) + 1;
  attempts = 7;
  $('#msg').text('').removeClass();
  $('#tries').text(attempts);
  $('#guess').val('').prop('disabled', false);
  $('#try').prop('disabled', false);
}

$('#try').click(()=>{
  const guess = parseInt($('#guess').val());
  if(!guess || guess < 1 || guess > 100) return;

  attempts--;
  $('#tries').text(attempts);

  if(guess === number){
    $('#msg').text('Correct! 🎉').addClass('win');
    endGame();
  }else if(attempts === 0){
    $('#msg').text(`Out of tries! Number was ${number}`).addClass('lose');
    endGame();
  }else if(guess < number){
    $('#msg').text('Too low').addClass('hint');
  }else{
    $('#msg').text('Too high').addClass('hint');
  }
});

$('#reset').click(resetGame);

function endGame(){
  $('#guess').prop('disabled', true);
  $('#try').prop('disabled', true);
}

/* init */
resetGame();
</script>

</body>
</html>
