<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Match</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{ box-sizing:border-box }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-family:Segoe UI, system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:#e5e7eb;
}

h1{ margin-bottom:10px; }

/* controls */
.controls{
  display:flex;
  gap:12px;
  margin-bottom:14px;
}

select, button{
  padding:10px 18px;
  font-weight:600;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background: rgba(255,255,255,0.12);
  color:#e5e7eb;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 16px rgba(0,0,0,0.35);

  transition: background 0.2s ease, transform 0.15s ease;
}

select:hover, button:hover{
  background: rgba(255,255,255,0.18);
  transform: translateY(-1px);
}

/* board */
#cards{
  display:grid;
  gap:14px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  padding:20px;
  border-radius:18px;

  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

/* card */
.card{
  width:72px;
  height:72px;
  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:26px;
  font-weight:700;

  background: rgba(255,255,255,0.12);
  color:#e5e7eb;

  cursor:pointer;
  user-select:none;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 6px 16px rgba(0,0,0,0.35);

  transition: transform 0.15s ease, background 0.2s ease;
}

.card:hover{ transform: translateY(-2px); }

.card.open{
  background:#38bdf8;
  color:#020617;
}

.card.matched{
  background:#22c55e;
  color:#020617;
  cursor:default;
  box-shadow: 0 0 18px rgba(34,197,94,0.6);
}

#status{
  margin-top:14px;
  font-size:14px;
  opacity:0.85;
}
</style>
</head>

<body>

<h1>Memory Match</h1>

<div class="controls">
  <select id="grid">
    <option value="4">4 × 4</option>
    <option value="6">6 × 6</option>
    <option value="8">8 × 8</option>
  </select>
  <button id="reset">Soft Reset</button>
</div>

<div id="cards"></div>
<div id="status">Select grid & play</div>

<script>
let openCards = [];
let lockBoard = false;
let totalCards = 16;

/* generate board */
function buildBoard(size){
  $('#cards').empty();
  openCards = [];
  lockBoard = false;

  totalCards = size * size;
  $('#cards').css('grid-template-columns', `repeat(${size}, 1fr)`);

  const pairs = totalCards / 2;
  let values = [];

  for(let i=1;i<=pairs;i++){
    values.push(i,i);
  }

  values.sort(()=>Math.random()-0.5);

  values.forEach(v=>{
    $('#cards').append(
      `<div class="card" data-value="${v}">?</div>`
    );
  });

  $('#status').text('Find all pairs');
}

/* card logic */
$(document).on('click', '.card', function(){
  if(lockBoard) return;
  if($(this).hasClass('open') || $(this).hasClass('matched')) return;

  $(this).addClass('open').text($(this).data('value'));
  openCards.push(this);

  if(openCards.length === 2){
    lockBoard = true;

    const a = $(openCards[0]);
    const b = $(openCards[1]);

    if(a.data('value') === b.data('value')){
      a.add(b).addClass('matched').removeClass('open');
      openCards = [];
      lockBoard = false;

      if($('.matched').length === totalCards){
        $('#status').text('All pairs matched 🎉');
      }
    }else{
      setTimeout(()=>{
        a.add(b).removeClass('open').text('?');
        openCards = [];
        lockBoard = false;
      }, 600);
    }
  }
});

/* controls */
$('#reset').click(()=>{
  buildBoard(parseInt($('#grid').val()));
});

$('#grid').change(function(){
  buildBoard(parseInt(this.value));
});

/* init */
buildBoard(4);
</script>

</body>
</html>
