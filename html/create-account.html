<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – CJ</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="icon" type="image/png" href="../img/login.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

<header class="site-header">
  <img src="../img/pfp.jpg" alt="Site Logo" class="site-logo">
  <h1 class="site-title">Cj's Website! <i class="fa-solid fa-crown"></i></h1>
  <hr>
</header>

<div class="container">

  <nav class="sidebar">
    <a href="index.html" class="navigation"><i class="fa-solid fa-house"></i> Home</a>
    <a href="about.html" class="navigation"><i class="fa-solid fa-address-card"></i> About Me</a>
    <a href="../game files/game picker/arcadenexus.html" class="navigation">
      <i class="fa-solid fa-gamepad"></i> Arcade Nexus
    </a>
    <a href="calc.html" class="navigation"><i class="fa-solid fa-calculator"></i> Calculator</a>
    <a href="login.html" class="navigation">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
    </a>
    <a href="ClassAttendance.html" class="navigation">
      <i class="fa-solid fa-clipboard-user"></i> Attendance
    </a>
  </nav>

  <main class="content login-page">

    <section class="login-card">
      <h2>Create Account</h2>
      <p class="login-subtext">Join us and start exploring the site.</p>

      <form id="createAccount">

        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="Email address" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="signupPassword" placeholder="Password" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm password" required>
        </div>

        <button type="submit" id="submit">Create Account</button>

        <p class="create-account">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

      </form>
    </section>

  </main>
</div>

<footer>
  <a href="https://facebook.com"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
  <a href="https://instagram.com"><i class="fa-brands fa-instagram"></i> Instagram</a>
  <a href="https://tiktok.com"><i class="fa-brands fa-tiktok"></i> Tiktok</a>
  <a href="mailto:yourname@gmail.com"><i class="fa-solid fa-at"></i> Gmail</a>
</footer>

<div class="endtitle">
  <h3>Glad to have you here 👋</h3>
</div>

<script src="../js/script.js"></script>
</body>
</html>
